services:
  calendar-dash:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-dev}
    # CALDAV_URL, CALDAV_USER, CALDAV_PASSWORD and the optional settings, kept next to this file on the host, not in git
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - "3000:8080"
    restart: unless-stopped
    # no shell or curl in the image, so node does the check
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
